# classroom with the materials of the paper (Table A1) = thesis Table 4.2; configs/classroom.toml has the thesis run's
# Layer mapping: Glass = glazing, Wood = timber door, BlackBoard = blackboard, White = plastered wall,
# Roof = suspended gypsum ceiling, Floor = floor tiles

[room]
model = "models/private/Real_ClassRoom.3dm"

[materials]  # layer name = absorption and scattering, one value or one per octave band 125 Hz - 4 kHz
Glass      = { absorption = [0.05, 0.03, 0.04, 0.04, 0.05, 0.05], scattering = [0.03, 0.02, 0.02, 0.01, 0.01, 0.01] }
Wood       = { absorption = [0.17, 0.12, 0.11, 0.09, 0.08, 0.10], scattering = [0.60, 0.45, 0.32, 0.38, 0.30, 0.30] }
BlackBoard = { absorption = [0.01, 0.01, 0.01, 0.02, 0.02, 0.02], scattering = [0.10, 0.05, 0.04, 0.04, 0.03, 0.03] }
White      = { absorption = [0.02, 0.02, 0.03, 0.02, 0.03, 0.04], scattering = 0.05 }
Roof       = { absorption = [0.11, 0.21, 0.18, 0.25, 0.19, 0.14], scattering = [0.03, 0.03, 0.02, 0.02, 0.01, 0.01] }
Floor      = { absorption = [0.01, 0.01, 0.01, 0.02, 0.02, 0.02], scattering = [0.04, 0.03, 0.02, 0.02, 0.01, 0.01] }

[simulation]
rays = 22900
ism_order = 5
receiver_radius = 0.2
time_step = 0.001
max_time = 3.0
seed = 1

[air]
temperature = 20.0
humidity = 50.0
