# 9 x 7 x 5 m test room of the CATT comparison
# Ported from configs/legacy/test_room.py

[room]
model = "models/Simple_Test.3dm"

[materials]  # layer name = absorption and scattering, one value or one per octave band 125 Hz - 4 kHz
Woolen  = { absorption = [0.15, 0.20, 0.30, 0.45, 0.52, 0.40], scattering = 0.10 }
Mat     = { absorption = [0.15, 0.20, 0.30, 0.45, 0.45, 0.40], scattering = 0.10 }
Plaster = { absorption = [0.01, 0.02, 0.05, 0.10, 0.15, 0.20], scattering = 0.10 }
Wood    = { absorption = [0.10, 0.20, 0.10, 0.20, 0.30, 0.40], scattering = 0.10 }

[surfaces]  # optional grouping of the polygons for the statistics per surface; normals point into the room
floor   = { normal = [0, 0, 1] }
ceiling = { normal = [0, 0, -1] }
wall_x0 = { x = [0, 0] }
wall_x9 = { x = [9, 9] }
wall_y0 = { y = [0, 0] }
wall_y7 = { y = [7, 7] }

[simulation]
rays = 31500  # 100 rays per m3
ism_order = 3
receiver_radius = 0.2
time_step = 0.001
max_time = 3.0
seed = 1

[air]
temperature = 20.0
humidity = 50.0
